<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 48px;
      }

      .logo {
        height: 52px;
        width: auto;
        display: block;
      }

      h1 {
        font-family: 'Cabinet Grotesk', system-ui, sans-serif;
        font-weight: 800;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #f5f5f5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../public/logo-reverse.png" alt="" />
    <h1>Bangalore's HOTLIST</h1>
  </body>
</html>
